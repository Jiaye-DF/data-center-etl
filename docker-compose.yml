services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - BACKEND_PORT=8000
      # container 內須以 service name 連 DB(覆蓋 .env 的 localhost,僅供本機 dev)
      - DATABASE_URL=postgresql+asyncpg://data_center_etl:changeme-development@postgres:5432/data_center_etl

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped


  postgres:
    image: postgres:18-alpine
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_DB=data_center_etl
      - POSTGRES_USER=data_center_etl
      - POSTGRES_PASSWORD=changeme-development
    volumes:
      # postgres 18+ 建議掛載 /var/lib/postgresql(資料置於版本子目錄),非舊版 /data
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_center_etl -d data_center_etl"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped



volumes:
  postgres_data:

