services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* 於 build 時烘入 bundle;缺值 build 直接 fail-fast(scan R-ENV-004)
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_SSO_URL: ${NEXT_PUBLIC_SSO_URL:-}
        NEXT_PUBLIC_SSO_APP_ID: ${NEXT_PUBLIC_SSO_APP_ID:-}
    # 自建 image 一律 etl_ prefix(propose v1.1.0 驗收標準)
    image: etl_frontend
    container_name: etl_frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - TZ=Asia/Taipei
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: etl_backend
    container_name: etl_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - BACKEND_PORT=8000
      # uvicorn 行程數(command 以此啟動);本地預設 2,可由 .env 覆蓋
      - UVICORN_WORKERS=${UVICORN_WORKERS:-2}
      # container 內須以 service name 連 DB / redis(覆蓋 .env 的 localhost,僅供本機 dev)
      # 帳密由 .env 注入,禁寫死(見 docs/Design-Base/00-overview/02-secrets.md)
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      # DB 連線池 env 化:多 worker 時每行程各一組池,總連線須 < postgres max_connections
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-5}
      - TZ=Asia/Taipei
    # 本地一鍵起跑:先套 migration 再起 API(lifespan 建 init admin 需資料表已存在);
    # 正式部署的 migration 時機見 docs/Design-Base/06-Coolify-CD/05-deploy-flow.md
    # uvicorn workers 由 environment 的 UVICORN_WORKERS 控制(容器內 shell 展開,$$ 避免 compose 先插值);預設 2
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers $${UVICORN_WORKERS:-2}"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # taskiq worker:消費 redis 佇列執行 run_etl(共用 etl_backend image,不重複 build)
  worker:
    image: etl_backend
    container_name: etl_worker
    command: ["taskiq", "worker", "app.worker.tasks:broker"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-5}
      - TZ=Asia/Taipei
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 等 backend healthy = migration 已完成(worker 寫 runs / run_logs 表)
      backend:
        condition: service_healthy
    # 覆蓋 image 內建 HEALTHCHECK(worker 無 HTTP 端點,改驗 redis 連線可達)
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('redis', 6379), 3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # taskiq scheduler:自 DB schedules 表讀排程,到點派工到 redis 佇列
  scheduler:
    image: etl_backend
    container_name: etl_scheduler
    command: ["taskiq", "scheduler", "app.worker.scheduler:scheduler"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-5}
      - TZ=Asia/Taipei
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 等 backend healthy = migration 已完成(scheduler 讀 schedules 表)
      backend:
        condition: service_healthy
    # 覆蓋 image 內建 HEALTHCHECK(scheduler 無 HTTP 端點,改驗 redis 連線可達)
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('redis', 6379), 3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  postgres:
    # 版本由 .env 的 POSTGRES_VERSION 注入(對齊 .env.example 登記;18 = 01-versions.md 鎖定線)
    image: postgres:18-alpine
    # 官方 image 以 container_name 標示 etl_ prefix
    container_name: etl_postgres
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=Asia/Taipei
    volumes:
      # postgres 18+ 建議掛載 /var/lib/postgresql(資料置於版本子目錄),非舊版 /data
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    # 鎖版:明確版號 tag,禁 latest(docs/Design-Base/06-Coolify-CD/01-compose.md)
    image: redis:8.8.0-alpine
    # 官方 image 以 container_name 標示 etl_ prefix
    container_name: etl_redis
    environment:
      - TZ=Asia/Taipei
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
